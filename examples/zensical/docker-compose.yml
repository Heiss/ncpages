# One container: watch, build, gate, publish and serve.
#
# The generator runs as a subprocess, so a crash in it is an exit code rather
# than a dead service, and the HTTP server is a task in the same process. There
# is no second container to keep in sync, no shared volume between them and no
# UID to match.
#
# If you want the build isolated from the credentials anyway, the README shows
# the two-container variant — same image, different roles.
#
# Run `make net` once before the first `up`: Compose cannot express a dependency
# on a network owned by another stack.

name: ncpages

services:
  ncpages:
    build: .
    command: ["run"]
    restart: unless-stopped
    volumes:
      # Working copy, build tree, releases and state. One volume, because the
      # build tree and the releases must share a filesystem or publishing
      # degrades from a rename to a copy.
      - work:/work
      # Configuration and hooks: root-owned, read-only, and outside the vault.
      - ./etc:/etc/ncpages:ro
      - ./secrets:/run/secrets:ro
    ports:
      # Your reverse proxy points here. TLS, certificates and DNS stay its job.
      - "8080:8080"
      # Health, on localhost only.
      - "127.0.0.1:9090:9090"
    networks: [cloud-bridge]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "ncpages", "--config", "/etc/ncpages/ncpages.toml", "check"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  work:

networks:
  # Created by `make net`, owned by neither stack. Binding the Nextcloud stack's
  # default network instead is a trap: `docker compose down` there deletes it and
  # recreates it with a new ID.
  cloud-bridge:
    external: true
