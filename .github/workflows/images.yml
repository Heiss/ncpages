name: Images

# Multi-arch images to GHCR. arm64 is not optional: a large share of the homelab
# audience runs on it, and amd64-only halves the reachable user base.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "Cargo.*"
      - "Dockerfile"
      - ".github/workflows/images.yml"
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build for this runner's architecture first and actually run it. Pushing
      # an image that cannot start is a failure mode worth ten seconds.
      - name: Build and smoke-test amd64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: ncpages:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image starts and reports a version
        run: |
          docker run --rm ncpages:smoke --version
          # A config error must be an error, not a silent default.
          if docker run --rm ncpages:smoke check 2>/dev/null; then
            echo "check succeeded without a config file" >&2
            exit 1
          fi

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags for the default image
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # The default: Alpine with a shell, because hook scripts need one.
      - name: Push runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tags for the serve-only image
        id: meta-serve
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          flavor: suffix=-serve,onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      # For the serve role only: no shell, no package manager, nothing but the
      # binary. Runs no hooks, so it needs neither.
      - name: Push serve
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: serve
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-serve.outputs.tags }}
          labels: ${{ steps.meta-serve.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report sizes
        run: |
          docker images ncpages:smoke --format '{{.Repository}}:{{.Tag}}  {{.Size}}'
